<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>gnnz | acervo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* === I. AXIOMAS === */
        :root {
            --bg: #000000;
            --bg-grad: radial-gradient(circle at 50% 50%, #0f0f0f 0%, #000000 100%);
            --accent: #D4AF37;
            --text-pri: #F0F0F0;
            --text-sec: #666;
            --header-h: 100px;
            --hero-frame-w: 800px;
            --ease-lux: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg);
            background-image: var(--bg-grad);
            color: var(--text-pri);
            font-family: 'Manrope', sans-serif;
            overflow-x: hidden;
            height: 100%;
            perspective: 1000px;
        }

        /* Trava de rolagem quando o Viewer está aberto */
        body.locked { overflow: hidden; height: 100vh; }

        /* Tipografia */
        .serif { font-family: 'Playfair Display', serif; }
        .meta { font-size: 0.75rem; color: var(--text-sec); letter-spacing: 0.25em; text-transform: uppercase; font-weight: 500; }

        /* === II. HEADER (Fixo e Supremo) === */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-h);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; /* Z-index máximo para garantir que segue */
            pointer-events: none;
            backdrop-filter: blur(2px); /* Leve blur para separar do fundo */
        }
        
        .logo-ghost {
            pointer-events: auto;
            width: 50px; opacity: 0.3; cursor: pointer;
            transition: opacity 0.4s ease, transform 0.4s var(--ease-lux);
            filter: grayscale(1);
        }
        .logo-ghost:hover { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
        
        /* Effect: Reality Bend */
        .reality-bend { animation: bend-anim 0.6s cubic-bezier(.25, .46, .45, .94) both; }
        .reality-bend body { filter: invert(1); background: #fff; }
        @keyframes bend-anim {
            0% { transform: rotateX(0) rotateY(0) scale(1); }
            30% { transform: rotateX(5deg) rotateY(-5deg) scale(0.95); }
            50% { transform: rotateX(-5deg) rotateY(5deg) scale(0.98) skewX(2deg); }
            100% { transform: rotateX(0) rotateY(0) scale(1); }
        }

        /* === III. HERO (Preenchimento Total) === */
        .hero-screen {
            height: 100dvh; width: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; padding-top: var(--header-h);
        }

        .hero-carousel {
            position: relative; width: 100%; max-width: var(--hero-frame-w);
            display: flex; flex-direction: column; align-items: center;
        }

        .frame-mask {
            width: 100%; 
            aspect-ratio: 16/10; /* Desktop: Paisagem */
            overflow: hidden; position: relative;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8);
            border: 1px solid #1a1a1a;
            background: #050505;
            cursor: zoom-in;
            transition: aspect-ratio 0.4s ease; /* Transição suave ao redimensionar */
        }

        .h-slide {
            position: absolute; inset: 0; opacity: 0;
            transform: scale(1.1); transition: opacity 1s, transform 1.2s var(--ease-lux);
            pointer-events: none;
        }
        .h-slide.active { opacity: 1; transform: scale(1); z-index: 2; pointer-events: auto; }
        
        /* AQUI ESTÁ A MUDANÇA: COVER para preencher tudo */
        .h-slide img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            object-position: center top; /* Foco no rosto/topo da imagem */
        }

        .h-nav-btn {
            position: absolute; top: 40%; transform: translateY(-50%);
            width: 50px; height: 100px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 2rem; opacity: 0; transition: 0.3s; z-index: 10;
        }
        .hero-carousel:hover .h-nav-btn { opacity: 0.5; }
        .h-nav-btn:hover { opacity: 1; color: var(--accent); }
        .h-prev { left: -60px; } .h-next { right: -60px; }

        .h-caption {
            margin-top: 2rem; text-align: center; height: 80px;
            opacity: 0; transform: translateY(20px); transition: 0.6s var(--ease-lux);
        }
        .h-caption.visible { opacity: 1; transform: translateY(0); }
        .h-title { font-size: 2.2rem; margin-bottom: 0.5rem; line-height: 1.1; }
        .h-dots { display: flex; gap: 10px; margin-top: 1rem; }
        .dot { width: 4px; height: 4px; background: #333; border-radius: 50%; transition: 0.3s; }
        .dot.active { background: var(--text-pri); transform: scale(1.5); }

        /* === AJUSTES MOBILE HERO (O Pulo do Gato) === */
        @media (max-width: 900px) {
            .hero-carousel { width: 90%; }
            .h-nav-btn { display: none; }
            
            /* No mobile, mudamos a proporção para RETRATO (3:4) 
               Assim a imagem "Faces" preenche a tela verticalmente de forma gloriosa */
            .frame-mask { aspect-ratio: 3/4; } 
        }

        /* === IV. ACERVO === */
        .acervo-section { padding: 4rem 0; position: relative; }
        .sec-head { padding: 0 5% 2rem 5%; display: flex; justify-content: space-between; align-items: flex-end; }
        .carousel-ctrls { display: flex; gap: 15px; }
        .c-btn {
            width: 40px; height: 40px; border: 1px solid #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: 0.3s; color: #fff;
        }
        .c-btn:hover { border-color: var(--accent); color: var(--accent); }
        .carousel-track {
            display: flex; gap: 30px; padding: 0 5% 3rem 5%;
            overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none;
        }
        .card {
            flex: 0 0 300px; position: relative; cursor: pointer;
            transition: transform 0.4s var(--ease-lux);
        }
        .card:hover { transform: translateY(-10px); }
        .card-img-box {
            width: 100%; aspect-ratio: 3/4; overflow: hidden; margin-bottom: 1rem; background: #111;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.8); transition: 0.6s; }
        .card:hover img { filter: saturate(1.1); transform: scale(1.05); }

        /* === V. MEMÓRIAS === */
        .memory-section { padding: 4rem 5%; display: flex; justify-content: center; }
        .video-trigger {
            width: 100%; max-width: 900px; height: 500px;
            background: #080808; border: 1px solid #151515;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; position: relative; overflow: hidden;
            transition: border-color 0.4s;
        }
        .video-trigger:hover { border-color: var(--accent); }
        .play-symbol {
            width: 70px; height: 70px; border: 2px solid #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 1.5rem;
            transition: 0.4s var(--ease-lux); margin-bottom: 1.5rem;
        }

        /* === VI. FOOTER === */
        footer {
            padding: 2rem 0 4rem 0; text-align: center; border-top: 1px solid #111; margin-top: 2rem;
        }
        .copyright {
            font-family: 'Manrope', sans-serif; font-size: 0.8rem;
            color: #333; letter-spacing: 0.2em; text-transform: uppercase;
        }
        .copyright span { color: var(--accent); font-size: 1.5rem; vertical-align: sub; margin: 0 5px; line-height: 0; }

        /* === VII. VIEWER ESTABILIZADO & DETALHISTA === */
        .lightbox {
            position: fixed; inset: 0; background: #000; z-index: 5000;
            opacity: 0; pointer-events: none; transition: opacity 0.4s;
            overflow: hidden; /* Garante que nada sai */
            display: flex; align-items: center; justify-content: center; /* Centralização absoluta */
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        
        .lb-container {
            position: relative;
            /* Container interno para segurar a imagem e o detalhe minimalista */
            display: flex; align-items: center; justify-content: center;
        }

        .lb-img {
            max-width: 90vw; max-height: 90vh;
            object-fit: contain;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: grab;
            position: relative; z-index: 2;
        }
        .lb-img:active { cursor: grabbing; }

        /* O Detalhe Minimalista (Cantoneiras/Brackets) */
        .lb-bracket {
            position: absolute; width: 20px; height: 20px;
            border-color: rgba(255,255,255,0.4); border-style: solid;
            pointer-events: none; z-index: 3; transition: 0.4s;
            opacity: 0; transform: scale(1.2);
        }
        .lightbox.active .lb-bracket { opacity: 1; transform: scale(1); }
        .b-tl { top: -10px; left: -10px; border-width: 1px 0 0 1px; }
        .b-tr { top: -10px; right: -10px; border-width: 1px 1px 0 0; }
        .b-bl { bottom: -10px; left: -10px; border-width: 0 0 1px 1px; }
        .b-br { bottom: -10px; right: -10px; border-width: 0 1px 1px 0; }

        /* UI Controls */
        .lb-ui {
            position: absolute; bottom: 30px; display: flex; gap: 20px; z-index: 5002;
        }
        .lb-btn {
            width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 50%;
            color: #fff; border: none; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .lb-close { 
            position: absolute; top: 30px; right: 30px; 
            cursor: pointer; color: #fff; font-size: 1.5rem; padding: 10px; z-index: 5002; 
        }

        /* Loader para Vídeo */
        .video-loader {
            position: absolute; width: 40px; height: 40px;
            border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Mobile Rotation */
        @media (max-width: 768px) {
            .lightbox.rotated .lb-container {
                width: 100vh; height: 100vw;
                transform: rotate(90deg);
            }
            .lightbox.rotated .lb-img {
                width: 95vh; height: 95vw; max-width: none; max-height: none;
                object-fit: contain;
            }
        }

    </style>
</head>
<body>

    <header>
        <div class="logo-ghost" onclick="Magic.trigger(this)">
            <img src="logo.png" alt="GENNOZ" style="width: 100%; height: auto;">
        </div>
    </header>

    <section class="hero-screen">
        <div class="hero-carousel" id="hero-module">
            
            <div class="frame-mask" id="hero-frame" onclick="Viewer.openFromHero()">
                </div>

            <div class="h-caption" id="hero-cap">
                <h1 class="serif h-title">Carregando...</h1>
                <p class="meta">...</p>
            </div>

            <div class="h-nav-btn h-prev" onclick="Hero.prev()">&#8249;</div>
            <div class="h-nav-btn h-next" onclick="Hero.next()">&#8250;</div>
            <div class="h-dots" id="hero-dots"></div>
        </div>
    </section>

    <section class="acervo-section">
        <div class="sec-head">
            <div>
                <h2 class="serif" style="font-size: 2rem;">Acervo</h2>
                <p class="meta" style="color: var(--accent)">Seleção Principal</p>
            </div>
            <div class="carousel-ctrls">
                <div class="c-btn" onclick="Acervo.scroll(-1)">&#8592;</div>
                <div class="c-btn" onclick="Acervo.scroll(1)">&#8594;</div>
            </div>
        </div>
        <div class="carousel-track" id="acervo-track"></div>
    </section>

    <section class="memory-section">
        <div class="video-trigger" onclick="Viewer.openVideo()">
            <div class="play-symbol">▶</div>
            <h3 class="serif" style="font-size: 2rem; z-index: 2;">Patins & Itapuama</h3>
            <p class="meta" style="margin-top: 10px; z-index: 2;">ASSISTIR FILME</p>
        </div>
    </section>

    <footer>
        <p class="copyright">gnnz <span>&#8226;</span> 2000</p>
    </footer>

    <div class="lightbox" id="viewer">
        <div class="lb-close" onclick="Viewer.close()">✕</div>
        
        <div class="video-loader" id="v-loader"></div>

        <div class="lb-container" id="lb-container">
            <div class="lb-bracket b-tl"></div>
            <div class="lb-bracket b-tr"></div>
            <div class="lb-bracket b-bl"></div>
            <div class="lb-bracket b-br"></div>
            
            <div id="lb-content-wrapper"></div>
        </div>

        <div class="lb-ui" id="lb-controls">
            <button class="lb-btn" onclick="Viewer.zoom(-1)">-</button>
            <button class="lb-btn" onclick="Viewer.zoom(1)">+</button>
        </div>
    </div>

    <script>
        /* === DATA === */
        const DB = {
            hero: [
                { src: "Faces_dos_Guararapes-2025-Jaboatao.png", title: "Faces de Jaboatão", meta: "PRAZERES • 2025" },
                { src: "Familia-2025-Prazeres.jpg", title: "Raízes", meta: "PRAZERES • 2025" },
                { src: "Eu_Ela_e_os_Bebes-2025-Prazeres.jpg", title: "O Legado", meta: "PRAZERES • 2025" }
            ],
            acervo: [
                { src: "Praia_de_Serrambi-2024-Ipojuca.jpg", title: "Serrambi", meta: "IPOJUCA" },
                { src: "Orgulho_em_Calhetas-2024-Cabo.jpg", title: "Calhetas", meta: "CABO" },
                { src: "Praia_de_Piedade-2024-Jaboatao.jpg", title: "Piedade", meta: "JABOATÃO" },
                { src: "Engrenagens_do_Interior-2023-Carpina.jpg", title: "Engrenagens", meta: "CARPINA" },
                { src: "Crias_de_Prazeres-2024-Jaboatao.jpg", title: "Crias", meta: "JABOATÃO" }
            ],
            video: "Patins_e_Itapuama-2022-Cabo.mp4"
        };

        const Magic = {
            trigger(el) {
                if(navigator.vibrate) navigator.vibrate([20, 30, 20]);
                document.documentElement.classList.add('reality-bend');
                setTimeout(() => document.documentElement.classList.remove('reality-bend'), 650);
            }
        };

        const Hero = {
            idx: 0,
            touchStartX: 0,
            init() {
                const frame = document.getElementById('hero-frame');
                const dotsContainer = document.getElementById('hero-dots');

                DB.hero.forEach((item, i) => {
                    const div = document.createElement('div');
                    div.className = `h-slide ${i===0 ? 'active' : ''}`;
                    div.innerHTML = `<img src="${item.src}" onerror="this.style.display='none'">`;
                    frame.appendChild(div);

                    const dot = document.createElement('div');
                    dot.className = `dot ${i===0 ? 'active' : ''}`;
                    dot.onclick = () => this.goto(i);
                    dotsContainer.appendChild(dot);
                });
                this.updateText(0);
                this.initSwipe(frame);
            },
            initSwipe(el) {
                el.addEventListener('touchstart', e => { this.touchStartX = e.changedTouches[0].screenX; }, {passive: true});
                el.addEventListener('touchend', e => {
                    const touchEndX = e.changedTouches[0].screenX;
                    if (touchEndX < this.touchStartX - 50) this.next();
                    if (touchEndX > this.touchStartX + 50) this.prev();
                });
            },
            goto(n) {
                const slides = document.querySelectorAll('.h-slide');
                const dots = document.querySelectorAll('.dot');
                const total = DB.hero.length;
                this.idx = (n + total) % total;
                slides.forEach(s => s.classList.remove('active'));
                dots.forEach(d => d.classList.remove('active'));
                slides[this.idx].classList.add('active');
                dots[this.idx].classList.add('active');
                this.updateText(this.idx);
            },
            next() { this.goto(this.idx + 1); },
            prev() { this.goto(this.idx - 1); },
            updateText(i) {
                const cap = document.getElementById('hero-cap');
                cap.classList.remove('visible');
                setTimeout(() => {
                    cap.querySelector('h1').innerText = DB.hero[i].title;
                    cap.querySelector('p').innerText = DB.hero[i].meta;
                    cap.classList.add('visible');
                }, 400);
            }
        };

        const Acervo = {
            track: document.getElementById('acervo-track'),
            init() {
                DB.acervo.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-img-box"><img src="${item.src}" loading="lazy"></div>
                        <h4 class="serif">${item.title}</h4>
                        <p class="meta">${item.meta}</p>
                    `;
                    card.onclick = () => Viewer.openImage(item.src);
                    this.track.appendChild(card);
                });
            },
            scroll(d) { this.track.scrollBy({ left: d * 330, behavior: 'smooth' }); }
        };

        const Viewer = {
            box: document.getElementById('viewer'),
            wrapper: document.getElementById('lb-content-wrapper'),
            controls: document.getElementById('lb-controls'),
            loader: document.getElementById('v-loader'),
            scale: 1, isDragging: false, startX: 0, startY: 0, translateX: 0, translateY: 0,

            openFromHero() { this.openImage(DB.hero[Hero.idx].src); },

            openImage(src) {
                this.resetState();
                this.controls.style.display = 'flex';
                
                // Rotação Mobile Check
                if (window.innerWidth < 768) this.box.classList.add('rotated');
                else this.box.classList.remove('rotated');

                this.wrapper.innerHTML = `<img src="${src}" class="lb-img" id="active-img" draggable="false">`;
                this.box.classList.add('active');
                document.body.classList.add('locked'); // Trava Scroll

                const img = document.getElementById('active-img');
                this.addPanLogic(img);
            },

            openVideo() {
                this.resetState();
                this.controls.style.display = 'none';
                this.box.classList.remove('rotated');
                this.loader.style.display = 'block'; // Mostra loading

                // Cria elemento de vídeo
                const vid = document.createElement('video');
                vid.src = DB.video;
                vid.controls = true;
                vid.style.maxWidth = '90%';
                vid.style.maxHeight = '80vh';
                vid.style.boxShadow = '0 0 50px rgba(255,255,255,0.1)';
                
                // Listener para quando estiver pronto
                vid.oncanplay = () => {
                    this.loader.style.display = 'none';
                    vid.play();
                };

                this.wrapper.appendChild(vid);
                this.box.classList.add('active');
                document.body.classList.add('locked');
            },

            close() {
                this.box.classList.remove('active');
                document.body.classList.remove('locked');
                setTimeout(() => {
                    this.wrapper.innerHTML = '';
                    this.box.classList.remove('rotated');
                    this.loader.style.display = 'none';
                }, 400);
            },

            resetState() {
                this.scale = 1; this.translateX = 0; this.translateY = 0;
                this.wrapper.innerHTML = '';
            },

            zoom(dir) {
                const img = document.getElementById('active-img');
                if(!img) return;
                this.scale += dir * 0.5;
                if(this.scale < 1) this.scale = 1;
                if(this.scale > 4) this.scale = 4;
                this.updateTransform(img);
            },

            addPanLogic(img) {
                img.addEventListener('mousedown', e => {
                    if(this.scale <= 1) return;
                    this.isDragging = true;
                    this.startX = e.clientX - this.translateX;
                    this.startY = e.clientY - this.translateY;
                    img.style.cursor = 'grabbing';
                });
                window.addEventListener('mouseup', () => {
                    this.isDragging = false;
                    if(img) img.style.cursor = 'grab';
                });
                window.addEventListener('mousemove', e => {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    this.translateX = e.clientX - this.startX;
                    this.translateY = e.clientY - this.startY;
                    this.updateTransform(img);
                });
            },
            updateTransform(img) {
                img.style.transform = `translate(${this.translateX}px, ${this.translateY}px) scale(${this.scale})`;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            Hero.init(); Acervo.init();
            document.addEventListener('keydown', e => {
                if(e.key === 'Escape') Viewer.close();
                if(e.key === 'ArrowRight') Hero.next();
                if(e.key === 'ArrowLeft') Hero.prev();
            });
        });
    </script>
</body>
</html>
